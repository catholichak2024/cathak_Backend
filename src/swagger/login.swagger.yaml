paths:
  /EveryGrade/user/signup:
    post:
      tags:
        - User
      summary: 회원가입
      operationId: postSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 이름1
                id:
                  type: string
                  example: catholic1
                pw:
                  type: string
                  example: qwerty
                number:
                  type: string
                  example: 202400001
                major_type:
                  type: string
                  enum: [전공심화, 복수전공, 부전공]
                  example: 전공심화
                major1:
                  type: string
                  example: 컴퓨터정보공학부
                major2:
                  type: string
                  example: 
                minor:
                  type: string
                  example: 
              required:
                - name
                - id
                - pw
                - number
                - major_type
                - major1
      responses:
        '200':
          description: 회원가입 성공
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              isSuccess:
                type: boolean
                example: true
              code:
                type: integer
                example: 200
              message:
                type: string
                example: "success!"
              data:
                type: array
                example: {
                  "userData": []
                }
                
        '400':
          description: 잘못된 요청
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON001
              message:
                type: string
                example: 잘못된 요청입니다

        '500':
          description: 서버 에러
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON000
              message:
                type: string
                example: 서버 에러, 관리자에게 문의 바랍니다.

  /EveryGrade/user/login:
    post:
      tags:
        - User
      summary: 로그인
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: catholic1
                pw:
                  type: string
                  example: qwerty
              required:
                - id
                - pw
      responses:
        '200':
          description: 로그인 성공
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              isSuccess:
                type: boolean
                example: true
              code:
                type: integer
                example: 200
              message:
                type: string
                example: "success!"
              data:
                type: array
                example: {
                  "userData": []
                }
                
        '400':
          description: 잘못된 요청
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON001
              message:
                type: string
                example: 잘못된 요청입니다

        '500':
          description: 서버 에러
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              isSuccess:
                type: boolean
                example: false
              code:
                type: integer
                example: COMMON000
              message:
                type: string
                example: 서버 에러, 관리자에게 문의 바랍니다.